[project]
name = "instruction-core"
version = "0.0.1"
description = "ADHD Framework core: instruction_core"
requires-python = ">=3.11"
dependencies = [
    "exceptions-core",
    "modules-controller-core",
    "logger-util",
    "config-manager",
]

[project.urls]
Repository = "https://github.com/AI-Driven-Highspeed-Development/instruction_core.git"

[tool.adhd]
type = "core"
layer = "dev"

[tool.uv.sources]
exceptions-core = { git = "https://github.com/AI-Driven-Highspeed-Development/exceptions_core.git" }
modules-controller-core = { git = "https://github.com/AI-Driven-Highspeed-Development/modules_controller_core.git" }
logger-util = { git = "https://github.com/AI-Driven-Highspeed-Development/Logger-Util.git" }
config-manager = { git = "https://github.com/AI-Driven-Highspeed-Development/config-manager.git" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build]
dev-mode-dirs = [".."]
